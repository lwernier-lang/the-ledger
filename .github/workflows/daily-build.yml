name: Daily rebuild

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config user.name "the-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Daily briefing: $(date -u +'%Y-%m-%d')"
          git push
