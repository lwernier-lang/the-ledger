name: Daily rebuild

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name "the-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --quiet --cached || git commit -m "Daily briefing: $(date -u +'%Y-%m-%d')"
          git push
